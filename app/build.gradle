plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
// La clave se guarda localmente; no se escribe en el código de la pantalla.
def local = new Properties()
def config = rootProject.file('local.properties')
if (config.exists()) config.withInputStream { local.load(it) }
def mapsKey = local.getProperty('MAPS_API_KEY', '').trim()
android {
    namespace 'mx.edu.upp.examen'
    compileSdk 33
    buildToolsVersion '30.0.3'
    defaultConfig {
        applicationId 'mx.edu.upp.examen'
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName '1.0'
        manifestPlaceholders = [MAPS_API_KEY: mapsKey ?: 'KEY_NOT_CONFIGURED']
        buildConfigField 'boolean', 'MAPS_CONFIGURED', mapsKey ? 'true' : 'false'
    }
    buildFeatures { compose true }
    composeOptions { kotlinCompilerExtensionVersion '1.3.2' }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
}
dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation platform('androidx.compose:compose-bom:2022.10.00')
    implementation 'androidx.activity:activity-compose:1.6.1'
    implementation 'androidx.compose.material3:material3:1.0.1'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    implementation 'com.google.maps.android:maps-compose:2.5.3'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
}
